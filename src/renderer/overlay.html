<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The same policy the main window holds to. This panel reads files through
       the bridge and loads nothing over the network, so every remote origin is
       forbidden outright rather than merely unused. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 font-src 'self';
                 img-src 'self' data:;
                 media-src 'self' blob:;
                 connect-src 'none';
                 form-action 'none';
                 base-uri 'none';">
  <title>Nexa</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>

  <!-- The window is transparent and larger than the card. Everything visible is
       drawn inside this wrapper, which is what lets the glow spill past the
       card's edge instead of being clipped at the window's. -->
  <div class="stage" id="stage">
    <div class="aura" id="aura" aria-hidden="true"></div>

    <section class="card" id="card" role="dialog" aria-label="Nexa assistant" aria-live="polite">
      <header class="card-head" id="card-head">
        <div class="orb" id="orb" aria-hidden="true">
          <span class="orb-core"></span>
          <span class="orb-ring"></span>
        </div>
        <div class="head-text">
          <div class="head-title" id="head-title">Nexa</div>
          <div class="head-sub" id="head-sub">Ready</div>
        </div>
        <button class="ghost-btn" id="close-btn" aria-label="Close (Esc)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="card-body" id="body"></div>

      <footer class="composer" id="composer">
        <button class="mic-btn" id="mic-btn" aria-label="Speak">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </button>
        <input class="ask-input" id="ask-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Ask Nexa to find or convert something">
        <button class="send-btn" id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </button>
      </footer>
    </section>
  </div>

  <script type="module" src="js/overlay.js"></script>
</body>
</html>
